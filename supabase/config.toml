# Local Supabase stack: `supabase start` (needs Docker), then copy the printed
# API URL and anon key into .env as VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY.
project_id = "margin"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
# Magic-link emails land here when running locally: http://localhost:54324
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/settings", "http://localhost:4173/settings"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
